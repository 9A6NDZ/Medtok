targets:
  $default:
    builders:
      drift_dev:
        options:
          # Store DateTime columns as ISO-8601 text in UTC. This preserves full
          # precision and the UTC flag, which matters because the app keeps all
          # times in UTC in the DB and converts to the user's zone in the UI.
          # The alternative (unix seconds) loses sub-second precision and reads
          # back as local-time DateTime objects.
          store_date_time_values_as_text: true
